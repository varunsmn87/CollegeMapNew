<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahaajas College Exhibition Map</title>
    <style>
        /* === CSS STYLES === */
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; text-align: center; }
        header { background: #2c3e50; color: white; padding: 15px; }

        /* The Map Wrapper */
        #map-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            margin: 20px auto;
            border: 2px solid #ddd;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        #campus-map {
            display: block;
            width: 100%; /* Responsive */
            height: auto;
            max-width: 1200px; 
            min-width: 300px; /* Ensures map has size even if image loads slow */
            background-color: #ddd; /* Grey placeholder color */
        }

        /* The Pins */
        .pin {
            position: absolute;
            width: 24px;
            height: 24px;
            background: #e74c3c; /* Red */
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
            transition: transform 0.2s;
        }
        .pin:hover { transform: translate(-50%, -50%) scale(1.3); }

        .pin.stair-pin {
            background: #f1c40f; /* Yellow */
            border-radius: 4px; /* Square */
            width: 20px; height: 20px;
        }

        /* The Pop-up Info Card */
        #info-card {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 30px rgba(0,0,0,0.3);
            z-index: 100;
            text-align: left;
            display: none; /* Hidden by default */
        }
        #info-card.visible { display: block; }
        #close-card { float: right; border: none; background: none; font-size: 24px; cursor: pointer; }
        .highlight { color: #e74c3c; font-weight: bold; }
        .debug-toggle { font-size: 0.8rem; background: #34495e; padding: 5px 10px; border-radius: 4px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Mahaajas College Navigation</h1>
        <label class="debug-toggle">
            <input type="checkbox" id="debugMode"> 🔧 Developer Mode (Click map to get coords)
        </label>
    </header>

    <div id="map-container">
        <img src="mapn.png" id="campus-map" alt="College Map">
        <div id="pins-layer"></div>
    </div>

    <div id="info-card">
        <button id="close-card">×</button>
        <h2 id="card-title">Department Name</h2>
        <p>⭐ <span id="card-attraction">Attraction</span></p>
        <p>📍 <span id="card-stairs">Stairs Location</span></p>
    </div>

    <script>
        /* === JAVASCRIPT LOGIC === */
        
        // 1. DATA: Add your 23 departments here
        const locations = [
            {
                id: 1,
                name: "Main Auditorium",
                type: "attraction",
                x: 22.5, y: 84.0, 
                attraction: "Inaugural Ceremony",
                stairs: "Ramps at main entry"
            },
            {
                id: 2,
                name: "Physics Block",
                type: "attraction",
                x: 65.2, y: 78.5,
                attraction: "Tesla Coil Demo",
                stairs: "Spiral stairs near Zoology"
            },
            {
                id: 3,
                name: "Central Circle",
                type: "attraction",
                x: 54.0, y: 45.0,
                attraction: "Meeting Point",
                stairs: "N/A"
            }
        ];

        // 2. APP LOGIC
        const mapContainer = document.getElementById('map-container');
        const pinsLayer = document.getElementById('pins-layer');
        const infoCard = document.getElementById('info-card');
        const debugMode = document.getElementById('debugMode');

        function renderPins() {
            pinsLayer.innerHTML = '';
            locations.forEach(loc => {
                const pin = document.createElement('div');
                pin.className = loc.type === 'stair' ? 'pin stair-pin' : 'pin';
                pin.style.left = loc.x + '%';
                pin.style.top = loc.y + '%';
                pin.onclick = (e) => {
                    e.stopPropagation();
                    showCard(loc);
                };
                pinsLayer.appendChild(pin);
            });
        }

        function showCard(data) {
            document.getElementById('card-title').innerText = data.name;
            document.getElementById('card-attraction').innerText = data.attraction;
            document.getElementById('card-stairs').innerText = data.stairs;
            infoCard.classList.add('visible');
        }

        document.getElementById('close-card').onclick = () => infoCard.classList.remove('visible');
        mapContainer.onclick = (e) => {
            // Close card if clicking map (unless in debug mode)
            if (!debugMode.checked) infoCard.classList.remove('visible');
            
            // Developer Mode Logic
            if (debugMode.checked) {
                const rect = mapContainer.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                alert(`COORDINATES COPIED:\nx: ${x.toFixed(1)}, y: ${y.toFixed(1)}`);
            }
        };

        // Start
        renderPins();
    </script>
</body>
</html>
